; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nanofoc_d
include_dir = include

[env:nanofoc_d]
platform = espressif32@6.5.0
board = nanofoc_d
framework = arduino
lib_archive = false
; FW-BUG-017: every object rebuilds when include/lv_conf.h changes (its hash joins every compile command).
; FW-PUB-003: __FILE__ names framework and project sources relative to their roots, so the image carries no
; absolute build path (no account or folder name); see scripts/path_prefix_map.py. Only .rodata strings change.
extra_scripts =
	pre:scripts/lvconf_guard.py
	pre:scripts/path_prefix_map.py
; Every library the image compiles is pinned, the SdFat fork TinyUSB 3.1.0 pulls in unversioned too, so a fresh
; clone builds the same versions as the verified image (FW-SEC-002). TinyUSB also lists Adafruit SPIFlash and
; Adafruit NeoPixel: PlatformIO downloads them but never compiles them, so they stay out of lib_deps (a lib_deps
; entry is always compiled, which would add code to the image).
lib_deps =
	fastled/FastLED@3.6.0
	bxparks/AceButton@1.10.1
	fortyseveneffects/MIDI Library@5.0.2
	lvgl/lvgl@9.0.0
	bodmer/TFT_eSPI@2.5.43
	bblanchon/ArduinoJson@7.0.2
	adafruit/Adafruit TinyUSB Library@3.1.0
	adafruit/SdFat - Adafruit Fork@2.3.103
	askuric/Simple FOC @ 2.3.3
	simplefoc/SimpleFOCDrivers @ 1.0.7
	Wire
	sparkfun/SparkFun STUSB4500	@ 1.1.5
build_flags = 
	; FW-PUB-004: NANO_FIRMWARE_VERSION is the internal build id (tooling, manifests); the knob reports
	; "<NANO_FIRMWARE_PUBLIC>+<build id>.<binary letter>" (src/cc_fw_version.h). A changed image never reuses a public version.
	-DNANO_FIRMWARE_VERSION=\"1.0.0-cc5.8\"
	-DNANO_FIRMWARE_PUBLIC=\"2.0.0\"
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
	-DUSE_TINYUSB=1
	-DLV_CONF_PATH=$PROJECT_DIR/include/lv_conf.h
	-DUSER_SETUP_LOADED=1
	-DGC9A01_DRIVER=1
	-DTFT_MOSI=4
	-DTFT_MISO=-1
	-DTFT_SCLK=3
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=2
	-DTFT_BL=-1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DSPI_FREQUENCY=80000000
	-DUSB_MANUFACTURER="\"Binaris Circuitry\""
	-DUSB_PRODUCT="\"Nano_D++ (Beta)\""
	; -DAUDIO_FILES_STEREO=1
	; -DUSE_AUDIO_LIB=1
	-DAUDIO_EN=1

monitor_speed = 115200
monitor_filters = 
	send_on_enter
	esp32_exception_decoder
monitor_eol = LF
