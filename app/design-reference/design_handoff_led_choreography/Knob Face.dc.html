<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&amp;display=swap"></helmet>
<div style="zoom:{{ zoom }};position:relative;width:{{ w }}px;height:{{ h }}px;background:{{ bg }};flex:none;transform:{{ tilt }};transform-origin:50% 60%">
  <sc-if value="{{ isDevice }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:170px;top:170px;width:0;height:0">
      <sc-for list="{{ segs }}" as="sg" hint-placeholder-count="60">
        <div style="position:absolute;left:-2px;top:-5px;width:4px;height:10px;transform:{{ sg.tf }};background:{{ sg.bg }};box-shadow:{{ sg.sh }};transition:{{ sg.tr }}"></div>
      </sc-for>
    </div>
    <div style="position:absolute;left:44px;top:44px;width:252px;height:252px;border-radius:50%;background:#0a0a0a;box-shadow:inset 0 0 0 1px #262626"></div>
    <div style="position:absolute;left:49px;top:336px;display:flex;gap:22px">
      <sc-for list="{{ btns }}" as="b" hint-placeholder-count="4">
        <div style="width:44px;height:44px;background:#202020;box-shadow:{{ b.sh }};border-bottom:3px solid {{ b.strip }};transition:{{ b.tr }}"></div>
      </sc-for>
    </div>
  </sc-if>
  <div style="position:absolute;left:{{ lx }}px;top:{{ ly }}px;width:240px;height:240px;border-radius:50%;overflow:hidden;background:#000;font-family:Montserrat, sans-serif;font-weight:500;color:#F2F2F2;-webkit-font-smoothing:antialiased">
    <div style="position:absolute;inset:0;opacity:{{ cOp }};transform:{{ cTf }};transition:{{ cTr }}">
    <sc-if value="{{ showArt }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;opacity:{{ artWrapOp }};transform:{{ artWrapTf }};transition:{{ artTr }}">
      <div style="position:absolute;inset:0;background:{{ artBg }};opacity:{{ artDim }}"></div>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0.9) 62%, #000 70%)"></div>
          </div>
    </sc-if>
    <div style="position:absolute;left:30px;width:180px;top:32px;text-align:center;font-size:12px;line-height:14px;letter-spacing:0.08em;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.label }}</div>
    <sc-if value="{{ isHomeish }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;top:0;width:240px;height:240px;opacity:{{ trackOp }};transform:{{ trackTf }};transition:{{ trackTr }}">
        <div style="position:absolute;left:35px;width:170px;top:60px;text-align:center;font-size:22px;line-height:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance">{{ l.title }}</div>
        <div style="position:absolute;left:35px;width:170px;top:114px;text-align:center;font-size:14px;line-height:18px;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.sub }}</div>
      </div>
      <div style="position:absolute;left:28px;width:184px;top:100px;display:flex;justify-content:space-between">
        <sc-for list="{{ centerItems }}" as="c" hint-placeholder-count="4">
          <div style="width:46px;display:flex;flex-direction:column;align-items:center;gap:8px;color:{{ c.col }};opacity:{{ c.op }};transform:{{ c.tf }};transition:{{ c.tr }}">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"><path d="{{ c.d }}"></path></svg>
            <div style="font-size:12px;line-height:14px;white-space:nowrap">{{ c.w }}</div>
          </div>
        </sc-for>
      </div>
      <div style="position:absolute;left:0;top:0;width:240px;height:240px;opacity:{{ volOp }};transform:{{ volTf }};transition:{{ volTr }}">
        <div style="position:absolute;left:35px;width:170px;top:52px;text-align:center;font-size:14px;line-height:18px;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ volCap }}</div>
        <div style="position:absolute;left:0;width:240px;top:76px;display:flex;justify-content:center;align-items:baseline;gap:2px;font-size:48px;line-height:46px;font-weight:500;letter-spacing:-0.02em;color:#F2F2F2">{{ l.big }}<span style="font-size:22px;letter-spacing:0;color:#A6A6A6">%</span></div>
      </div>
      <div style="position:absolute;left:40px;width:160px;top:134px;text-align:center;font-size:12px;line-height:14px;color:{{ l.sc }};opacity:{{ stOp }};transition:opacity 240ms cubic-bezier(0.22,1,0.36,1)">{{ l.st }}</div>
    </sc-if>
    <sc-if value="{{ isWin }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:104px;top:42px;width:32px;height:32px;opacity:{{ l.iconOp }}">
        <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ true }}"><div style="width:32px;height:32px;background:{{ iconBg }}"></div></sc-if>
        <sc-if value="{{ noIcon }}" hint-placeholder-val="{{ false }}"><div style="width:32px;height:32px;background:#444;color:#F2F2F2;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:16px">{{ l.iconL }}</div></sc-if>
      </div>
      <div style="position:absolute;left:35px;width:170px;top:80px;text-align:center;font-size:14px;line-height:18px;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.sub }}</div>
      <div style="position:absolute;left:35px;width:170px;top:100px;text-align:center;font-size:16px;line-height:20px;color:{{ l.tc }};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance">{{ l.title }}</div>
      <div style="position:absolute;left:30px;width:180px;top:139px;text-align:center;font-size:12px;line-height:14px;color:{{ l.mc }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.meta }}</div>
    </sc-if>
    <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:35px;width:170px;top:52px;text-align:center;font-size:22px;line-height:26px;color:{{ l.tc }};display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance">{{ l.title }}</div>
      <div style="position:absolute;left:35px;width:170px;top:106px;text-align:center;font-size:14px;line-height:18px;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.sub }}</div>
      <div style="position:absolute;left:24px;width:192px;top:127px;text-align:center;font-size:12px;line-height:14px;color:{{ l.mc }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.meta }}</div>
    </sc-if>
    <sc-if value="{{ isTracks }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:30px;width:180px;top:54px;text-align:center;font-size:22px;line-height:26px;color:{{ l.tc }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.title }}</div>
      <div style="position:absolute;left:72px;width:96px;top:88px;display:flex;justify-content:space-between">
        <sc-for list="{{ l.pos }}" as="p" hint-placeholder-count="3">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ p.c }}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="{{ p.d }}"></path></svg>
        </sc-for>
      </div>
      <div style="position:absolute;left:35px;width:170px;top:110px;text-align:center;font-size:14px;line-height:18px;color:#A6A6A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ l.sub }}</div>
      <div style="position:absolute;left:30px;width:180px;top:130px;text-align:center;font-size:12px;line-height:14px;color:{{ l.mc }};white-space:nowrap">{{ l.meta }}</div>
    </sc-if>
    <div style="position:absolute;inset:0;opacity:{{ footOp }};transition:{{ footTr }}">
    <sc-for list="{{ foot }}" as="f" hint-placeholder-count="4">
      <div style="position:absolute;left:{{ f.x }}px;top:152px;width:44px;height:24px;display:flex;align-items:center;justify-content:center;color:{{ f.col }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="{{ f.d }}"></path></svg>
      </div>
    </sc-for>
    </div>
    </div>
    <sc-if value="{{ overlay }}" hint-placeholder-val="{{ false }}">
      <svg width="240" height="240" viewBox="0 0 240 240" style="position:absolute;left:0;top:0;pointer-events:none">
        <circle cx="120" cy="120" r="116" fill="none" stroke="rgba(255,60,40,0.38)" stroke-width="8"></circle>
        <circle cx="120" cy="120" r="104" fill="none" stroke="#35d0c0" stroke-width="1" stroke-dasharray="3 3"></circle>
        <path d="M56 146v36M99 146v36M141 146v36M184 146v36" stroke="#35d0c0" stroke-width="0.6" stroke-dasharray="2 2"></path>
        <path d="M0 120h240M120 0v240" stroke="rgba(53,208,192,0.25)" stroke-width="0.5"></path>
      </svg>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:400},&quot;view&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;part&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;device&quot;,&quot;lcd&quot;],&quot;default&quot;:&quot;device&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zoom&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;overlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tilt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;art&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { ent: 0, anim: false };
  componentDidUpdate(pp) {
    const a = pp.view, b = this.props.view;
    if (!a || !b || a.screenKey === b.screenKey || (this.props.part === 'lcd' && !this.props.live)) return;
    const dir = (b.depth || 0) >= (a.depth || 0) ? 1 : -1;
    cancelAnimationFrame(this._r1); cancelAnimationFrame(this._r2);
    this.setState({ ent: dir, anim: false });
    this._r1 = requestAnimationFrame(() => { this._r2 = requestAnimationFrame(() => this.setState({ ent: 0, anim: true })); });
  }
  componentWillUnmount() { cancelAnimationFrame(this._r1); cancelAnimationFrame(this._r2); }
  renderVals() {
    const v = this.props.view;
    const dev = (this.props.part || 'device') === 'device';
    const base = {
      isDevice: dev, w: dev ? 340 : 240, h: dev ? 400 : 240, lx: dev ? 50 : 0, ly: dev ? 50 : 0,
      bg: dev ? '#141414' : '#2b2b2b', zoom: this.props.zoom || 1, overlay: !!this.props.overlay,
      tilt: this.props.tilt ? 'perspective(520px) rotateX(38deg)' : 'none',
      cOp: this.state.ent ? 0 : 1, cTf: this.state.ent ? `translateX(${this.state.ent * 20}px)` : 'none',
      cTr: this.state.anim && !this.state.ent ? 'opacity 220ms cubic-bezier(0.22,1,0.36,1), transform 380ms cubic-bezier(0.22,1,0.36,1)' : 'none'
    };
    if (!v) return Object.assign(base, { l: {}, segs: [], foot: [], btns: [], isHome: true, isList: false, isTracks: false, showArt: false, artBg: 'none', artDim: 1, trackOp: 1, trackTf: 'none', volOp: 0, volTf: 'none', isHomeish: true, centerItems: [], trackTr: 'none', volTr: 'none', footTr: 'none', artTr: 'none', isWin: false, hasIcon: false, noIcon: false, iconBg: 'none', artWrapOp: 1, artWrapTf: 'none', volCap: '', idleOp: 0, idleTf: 'none', footOp: 1, stOp: 1 });
    const L = [0, 0.12, 0.34, 0.68, 1];
    const off = [31, 31, 31];
    const DECAY = 'background 260ms cubic-bezier(0.22,1,0.36,1), box-shadow 260ms cubic-bezier(0.22,1,0.36,1)';
    const SLEEP = 'background 1800ms cubic-bezier(0.45,0,0.55,1), box-shadow 1800ms cubic-bezier(0.45,0,0.55,1)';
    const WAKE = 'background 360ms cubic-bezier(0.22,1,0.36,1), box-shadow 360ms cubic-bezier(0.22,1,0.36,1)';
    const segs = v.ring.map((r, i) => {
      const tf = `rotate(${i * 6}deg) translateY(-138px)`;
      if (!r || !r.l) return { tf, bg: '#1f1f1f', sh: 'none', tr: v.ledSleep ? SLEEP : DECAY };
      const a = r.a != null ? r.a : L[r.l], c = r.c.split(',').map(Number);
      const m = c.map((x, k) => Math.round(off[k] + (x - off[k]) * a));
      return { tf, tr: v.ledSleep ? SLEEP : v.alive ? (a >= 0.95 && r.l >= 3 ? 'none' : WAKE) : r.l >= 3 ? 'none' : DECAY, bg: `rgb(${m.join(',')})`, sh: `0 0 ${2 + r.l * 3}px rgba(${r.c},${(a * 0.7).toFixed(2)})` };
    });
    const btns = v.buttons.map(b => {
      if (!b.l) return { tr: 'box-shadow 300ms ease, border-color 300ms ease', sh: 'inset 0 0 0 1px #2c2c2c', strip: '#262626' };
      const a = b.a != null ? b.a : L[b.l];
      return { tr: v.ledSleep ? 'box-shadow 1800ms cubic-bezier(0.45,0,0.55,1), border-color 1800ms cubic-bezier(0.45,0,0.55,1)' : 'box-shadow 300ms cubic-bezier(0.22,1,0.36,1), border-color 300ms cubic-bezier(0.22,1,0.36,1)', sh: `inset 0 0 0 1px #2c2c2c, 0 6px 16px -6px rgba(${b.c},${(a * 0.9).toFixed(2)})`, strip: `rgba(${b.c},${Math.max(a, 0.18).toFixed(2)})` };
    });
    const xs = [34, 77, 119, 162];
    const foot = v.foot.map((f, i) => Object.assign({}, f, { x: xs[i] }));
    const lay = v.lcd.layout;
    const showArt = !!this.props.art && !!v.lcd.art;
    const vv = !!v.lcd.volVis;
    const idle = lay === 'idle';
    const OUT = 'cubic-bezier(0.22,1,0.36,1)', IN = 'cubic-bezier(0.4,0,1,1)', SPR = 'cubic-bezier(0.34,1.45,0.64,1)';
    const showRow = idle && !vv;
    const centerItems = (v.lcd.center || []).map((c, i) => Object.assign({}, c, showRow
      ? { op: 1, tf: 'none', tr: `opacity 300ms ${OUT} ${200 + i * 45}ms, transform 460ms ${SPR} ${200 + i * 45}ms` }
      : { op: 0, tf: 'translateY(14px) scale(0.9)', tr: `opacity 140ms ${IN}, transform 160ms ${IN}` }));
    const trackTr = (vv || idle) ? `opacity 150ms ${IN}, transform 190ms ${IN}` : `opacity 320ms ${OUT} 90ms, transform 420ms ${OUT} 90ms`;
    const volTr = vv ? `opacity 180ms ${OUT} 50ms, transform 340ms ${SPR} 50ms` : `opacity 170ms ${IN}, transform 190ms ${IN}`;
    const footTr = idle ? `opacity 160ms ${IN}` : `opacity 280ms ${OUT} 140ms`;
    const artTr = idle ? `opacity 560ms ${OUT}, transform 1100ms ${OUT}` : `opacity 420ms ${OUT} 60ms, transform 700ms ${OUT} 60ms`;
    Object.assign(base, { centerItems, trackTr, volTr, footTr, artTr });
    Object.assign(base, { artWrapOp: lay === 'idle' ? 0 : 1, artWrapTf: lay === 'idle' ? 'scale(1.06)' : 'none', isWin: lay === 'win', hasIcon: !!v.lcd.icon, noIcon: !v.lcd.icon, iconBg: v.lcd.icon ? `url("${v.lcd.icon}") center / contain no-repeat` : 'none' });
    Object.assign(base, { isHomeish: lay === 'home' || idle, volCap: v.lcd.volCap || v.lcd.title || 'Nothing playing', trackOp: vv || idle ? 0 : 1, trackTf: vv ? 'translateY(-8px) scale(0.98)' : idle ? 'translateY(-10px)' : 'none', idleOp: idle && !vv ? 1 : 0, idleTf: idle && !vv ? 'none' : 'translateY(18px)', volOp: vv ? 1 : 0, volTf: vv ? 'none' : 'translateY(6px) scale(0.93)', footOp: idle ? 0 : 1, stOp: idle && !vv ? 0 : 1 });
    return Object.assign(base, { l: v.lcd, segs, btns, foot, isHome: lay === 'home', isList: lay === 'list', isTracks: lay === 'tracks',
      showArt, artBg: v.lcd.art || 'none', artDim: v.lcd.tc === '#7C7C7C' ? 0.35 : 0.8 });
  }
}
</script>
</body>
</html>
